baseURL = 'https://6900903-ai.github.io/my-website/'
title = 'My Blog'
theme = 'PaperMod'

enableRobotsTXT = true

[pagination]
  pagerSize = 10

[languages]
  [languages.en]
    languageName = "English"
    label = "EN"
    weight = 1
    contentDir = "content"

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false

  [params.homeInfoParams]
    Title = "Мой blog"
    Content = "Добро пожаловать 👋"

  [params.profileMode]
    enabled = false

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/safari-pinned-tab.svg"

  [[params.socialIcons]]
    name = "telegram"
    url = "https://t.me/your_channel"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/6900903-ai"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/your_handle"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:yury@chudzinovich.de"

  [params.analytics.google]
    SiteVerificationTag = "YOUR_GOOGLE_TAG"

  [params.analytics.yandex]
    SiteVerificationTag = "YOUR_YANDEX_TAG"

[[menu.main]]
name = "Главная"
url = "/"
weight = 1

[[menu.main]]
name = "Посты"
url = "/posts/"
weight = 2

[[menu.main]]
name = "Архив"
url = "/archives/"
weight = 3

[[menu.main]]
name = "Поиск"
url = "/search/"
weight = 4